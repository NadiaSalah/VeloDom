<article
  vd-class="{ 'ring-2 ring-primary': highlighted }"
  class="card h-full border border-slate-200 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-xl"
>
  <div class="card-body">
    <div class="flex flex-wrap gap-2">
      <span
        vd-for="tag in post?.tags || []"
        vd-text="tag"
        class="badge badge-outline badge-sm"
      ></span>
    </div>
    <h3
      vd-text="post?.title || 'Waiting for a featured post'"
      class="card-title text-slate-950"
    ></h3>
    <p
      vd-text="summary"
      class="line-clamp-3 text-sm leading-6 text-slate-600"
    ></p>
    <div class="mt-3 flex items-center justify-between gap-3">
      <span
        vd-text="post?.readTime || post?.category || 'VeloDom article'"
        class="text-xs text-slate-500"
      ></span>
      <a
        vd-if="Boolean(post?.id)"
        vd-bind:href="'/blog/posts/' + post.id"
        vd-nav
        class="btn btn-sm btn-primary"
      >
        Read
      </a>
    </div>
    <div class="card-actions mt-2">
      <button
        type="button"
        vd-on:click="toggleHighlight()"
        class="btn btn-xs btn-outline"
      >
        Highlight
      </button>
      <button
        type="button"
        vd-on:click="announce()"
        class="btn btn-xs"
      >
        Emit
      </button>
    </div>
  </div>
</article>
