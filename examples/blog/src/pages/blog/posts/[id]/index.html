<main class="mx-auto max-w-5xl px-5 py-10">
  <div class="mb-8 flex flex-wrap items-center justify-between gap-3">
    <a href="/" vd-nav class="btn btn-sm btn-ghost">← Back to articles</a>
    <button
      type="button"
      vd-request="articles.getOne"
      vd-request-config="{ params: { id: postId }, target: 'post', autoState: true }"
      class="btn btn-sm btn-outline"
    >
      Reload through vd-request
    </button>
  </div>

  <vd-component
    vd-if="postLoading"
    name="loader"
    vd-prop-label="Loading VeloDom article…"
  ></vd-component>
  <vd-component
    name="shared/error-message"
    vd-props="{ title: 'Article failed', message: postError }"
  ></vd-component>

  <article vd-if="Boolean(post)" class="rounded-[2rem] border border-slate-200 bg-white p-6 shadow-sm md:p-10">
    <div class="flex flex-wrap items-center gap-3">
      <span vd-text="post.category" class="badge badge-primary badge-outline"></span>
      <span vd-text="post.readTime" class="text-sm text-slate-500"></span>
    </div>
    <h1 vd-text="post.title" class="mt-5 text-4xl font-black leading-tight md:text-6xl"></h1>
    <p vd-text="post.excerpt" class="mt-5 text-xl leading-8 text-slate-600"></p>

    <div class="mt-8 flex flex-wrap gap-2">
      <span
        vd-for="tag in post.tags"
        vd-text="tag"
        class="badge badge-ghost"
      ></span>
    </div>

    <div class="prose prose-slate mt-10 max-w-none">
      <p vd-text="post.body" class="text-lg leading-9"></p>
    </div>
  </article>

  <section class="mt-10 rounded-[2rem] bg-slate-950 p-6 text-white">
    <p class="text-sm font-semibold text-primary">What this page demonstrates</p>
    <div class="mt-4 grid gap-4 md:grid-cols-3">
      <p class="rounded-2xl bg-white/10 p-4">Dynamic route params from <code>[id]</code>.</p>
      <p class="rounded-2xl bg-white/10 p-4">Imperative script loading in <code>script.js</code>.</p>
      <p class="rounded-2xl bg-white/10 p-4">Declarative reload through <code>vd-request</code>.</p>
    </div>
  </section>

  <section class="mt-10">
    <h2 class="text-3xl font-black">Read next</h2>
    <div class="mt-5 grid gap-5 md:grid-cols-3">
      <a
        vd-for="item in relatedPosts"
        vd-bind:href="'/blog/posts/' + item.id"
        vd-nav
        class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-1 hover:shadow-lg"
      >
        <span vd-text="item.category" class="badge badge-outline"></span>
        <strong vd-text="item.title" class="mt-3 block text-lg"></strong>
        <span vd-text="item.readTime" class="mt-2 block text-sm text-slate-500"></span>
      </a>
    </div>
  </section>
</main>
