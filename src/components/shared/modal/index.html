<div
  vd-if="opened"
  class="fixed inset-0 z-50 grid place-items-center bg-black/50 p-4"
>
  <button
    type="button"
    vd-on:click="close()"
    aria-label="Close modal"
    class="absolute inset-0 h-full w-full cursor-default bg-transparent"
  ></button>
  <div
    role="dialog"
    aria-modal="true"
    class="card relative w-full max-w-md bg-base-100 shadow-2xl"
  >
    <div class="card-body">
      <h2 vd-text="title || 'VeloDom modal'" class="card-title"></h2>
      <p vd-text="body || 'The page opened this reusable modal through a component ref and expose().'"></p>
      <div class="card-actions justify-end">
        <button vd-on:click="close()" class="btn btn-primary">Close</button>
      </div>
    </div>
  </div>
</div>
