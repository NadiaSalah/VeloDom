<main class="mx-auto max-w-3xl space-y-6 px-6 py-12">
  <p class="text-sm font-semibold uppercase tracking-widest text-primary">
    User code choice
  </p>

  <h1 class="text-4xl font-bold">TypeScript page, ordinary HTML</h1>

  <p class="text-base-content/70">
    This template is identical to a Vanilla JavaScript page. Only
    <code>script.ts</code> opts into types.
  </p>

  <section class="card border border-base-300 bg-base-100 shadow-sm">
    <div class="card-body gap-4">
      <h2 class="card-title" vd-text="message"></h2>

      <label class="form-control">
        <span class="label-text mb-2">Typed counter step</span>
        <input
          class="input input-bordered"
          type="number"
          vd-model="step"
        >
      </label>

      <div class="flex items-center gap-3">
        <button class="btn btn-primary" vd-on:click="increment()">
          Increment
        </button>
        <strong class="text-2xl" vd-text="count"></strong>
      </div>

      <p class="text-sm text-base-content/60" vd-text="lifecycleMessage"></p>
    </div>
  </section>

  <a class="link link-primary" href="/features" vd-nav>
    Back to framework features
  </a>
</main>
