<vd-component name="nav" vd-prop-title="Categories"></vd-component>

<main class="mx-auto w-[92%] max-w-7xl py-10">
  <header class="mb-8">
    <p class="text-sm font-semibold text-primary">DummyJSON tags</p>
    <h1 class="text-5xl font-black">Categories</h1>
    <p class="mt-3 max-w-2xl text-slate-600">
      Tags are loaded from DummyJSON and used as category filters for the
      VeloDom blog example.
    </p>
  </header>

  <section class="mb-8 rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
    <div class="flex flex-wrap gap-2">
      <button
        vd-for="tag in tags"
        vd-on:click="selectTag(tag)"
        vd-text="tag"
        vd-class="{ 'btn-primary': tag === activeTag, 'btn-outline': tag !== activeTag }"
        class="btn btn-sm"
      ></button>
    </div>
  </section>

  <vd-component
    vd-if="loading"
    name="loader"
    vd-prop-label="Loading category posts…"
  ></vd-component>
  <vd-component
    name="shared/error-message"
    vd-props="{ title: 'Category failed', message: error }"
  ></vd-component>

  <section vd-if="posts.length > 0" class="grid gap-5 md:grid-cols-2 lg:grid-cols-3">
    <article
      vd-for="post in posts"
      class="card h-full border border-slate-200 bg-white shadow-sm"
    >
      <div class="card-body">
        <h2 vd-text="post.title" class="card-title"></h2>
        <p vd-text="post.body.slice(0, 120) + '…'" class="text-sm text-slate-600"></p>
        <div class="card-actions justify-end">
          <a
            vd-bind:href="'/blog/posts/' + post.id"
            vd-nav
            class="btn btn-sm btn-primary"
          >
            Read
          </a>
        </div>
      </div>
    </article>
  </section>
</main>

<vd-component name="footer"></vd-component>
