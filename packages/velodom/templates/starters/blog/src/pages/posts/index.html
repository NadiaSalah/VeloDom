<main class="shell hero">
  <p>Latest writing</p>
  <h1>Posts</h1>
  <p vd-if="posts.length === 0">No posts yet.</p>
  <div vd-else class="card-grid">
    <div vd-for="post in posts" vd-key="post.title">
      <vd-component
        name="post-card"
        vd-props="{ title: post.title, summary: post.summary }"
      ></vd-component>
    </div>
  </div>
</main>
